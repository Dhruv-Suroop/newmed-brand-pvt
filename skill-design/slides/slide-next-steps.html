<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .slide{position:relative;width:1280px;height:720px;background:var(--nm-cream);overflow:hidden;font-family:var(--font-sans);color:var(--text-primary)}
  .content{position:relative;z-index:2;padding:80px 96px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
  .eye{font-size:14px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--brand-primary)}
  h2{font-family:var(--font-display);font-weight:600;font-size:46px;letter-spacing:-0.02em;line-height:1.05;margin:14px 0 44px;max-width:860px;color:var(--heading-color)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel">
const { ArrowList, Orb } = window.NewMedSkillsDesignSystem_cd1078;
function Slide(){
  return (
    <div className="slide">
      <Orb tone="yellow" size={480} style={{position:"absolute",right:-200,bottom:-220,opacity:0.6}} />
      <div className="content">
        <span className="eye">Where to start</span>
        <h2>Three ways to begin.</h2>
        <ArrowList size={88} items={[
          "Schedule a workforce planning discussion",
          "Launch a pilot recruitment programme",
          "Request a workforce readiness assessment",
        ]} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Slide/>);
</script>
</body>
</html>
