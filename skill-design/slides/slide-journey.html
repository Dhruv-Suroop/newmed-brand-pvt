<!-- @dsCard group="Slides" viewport="1280x720" name="Journey slide" subtitle="Who we are — the six-stage path" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .slide{position:relative;width:1280px;height:720px;background:var(--nm-cream);overflow:hidden;font-family:var(--font-sans);color:var(--text-primary)}
  .content{position:relative;z-index:2;padding:80px 96px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
  .eye{font-size:14px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--brand-primary)}
  h2{font-family:var(--font-display);font-weight:600;font-size:46px;letter-spacing:-0.02em;line-height:1.05;margin:14px 0 16px;max-width:900px;color:var(--heading-color)}
  p{font-size:20px;color:var(--text-secondary);max-width:820px;margin:0 0 48px;line-height:1.5}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel">
const { StepFlow, Orb } = window.NewMedSkillsDesignSystem_cd1078;
function Slide(){
  return (
    <div className="slide">
      <Orb tone="yellow" size={520} style={{position:"absolute",left:-220,bottom:-260,opacity:0.6}} />
      <div className="content">
        <span className="eye">Who we are</span>
        <h2>We manage the entire workforce journey.</h2>
        <p>From sourcing talent through deployment and ongoing development — one team handling workforce preparation, compliance, licensing, deployment and retention.</p>
        <StepFlow active={-1} style={{gap:12}} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Slide/>);
</script>
</body>
</html>
