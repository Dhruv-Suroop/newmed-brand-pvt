<!-- @dsCard group="Colors" viewport="700x150" name="Depth & ink" subtitle="Warm near-black ink, maroon and plum for depth" -->
<!DOCTYPE html><html><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
body{margin:0;background:var(--nm-cream);font-family:var(--font-sans);padding:20px;display:flex;gap:14px}
.sw{flex:1;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs);background:var(--color-bg-raised)}
.chip{height:64px}
.meta{padding:8px 10px}
.name{font-size:13px;font-weight:600;color:var(--text-primary)}
.hex{font-family:var(--font-mono);font-size:11.5px;color:var(--text-secondary);margin-top:2px}
</style></head><body>
<div class="sw"><div class="chip" style="background:#391e1a"></div><div class="meta"><div class="name">Ink — text</div><div class="hex">#391E1A</div></div></div>
<div class="sw"><div class="chip" style="background:#7c3134"></div><div class="meta"><div class="name">Maroon</div><div class="hex">#7C3134</div></div></div>
<div class="sw"><div class="chip" style="background:#7c6763"></div><div class="meta"><div class="name">Ink 500 — secondary</div><div class="hex">#7C6763</div></div></div>
</body></html>
