<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Soft and rounded everywhere" -->
<!DOCTYPE html><html><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
body{margin:0;background:var(--nm-cream);font-family:var(--font-sans);color:var(--text-primary);padding:24px;display:flex;gap:20px;align-items:flex-end}
.b{display:flex;flex-direction:column;align-items:center;gap:8px}
.sq{width:72px;height:72px;background:var(--color-bg-raised);border:1.5px solid var(--border-strong)}
.n{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}
</style></head><body>
<div class="b"><div class="sq" style="border-radius:var(--radius-sm)"></div><span class="n">sm 10</span></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-md)"></div><span class="n">md 16</span></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-lg)"></div><span class="n">lg 24</span></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-xl)"></div><span class="n">xl 32</span></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-icon)"></div><span class="n">icon 22%</span></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-pill)"></div><span class="n">pill</span></div>
</body></html>
