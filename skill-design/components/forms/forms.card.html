<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--nm-cream); font-family: var(--font-sans); color: var(--text-primary); padding: 28px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 22px 32px; max-width: 660px; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, IconButton, Input, Select, Checkbox, Radio, Switch } = window.NewMedSkillsDesignSystem_cd1078;
function Demo() {
  return (
    <div>
      <div className="row">
        <Button variant="primary">Book a call</Button>
        <Button variant="secondary">Learn more</Button>
        <Button variant="outline" iconRight={<span>→</span>}>How it works</Button>
        <Button variant="ghost">Skip</Button>
        <Button variant="primary" disabled>Disabled</Button>
        <IconButton variant="solid" aria-label="Next">→</IconButton>
        <IconButton variant="outline" aria-label="Search">⌕</IconButton>
      </div>
      <div className="grid">
        <div>
          <Input label="Work email" placeholder="you@hospital.org" hint="We reply within one business day." />
        </div>
        <div>
          <Select label="Profession" options={["Registered nurse","Allied health","Physician"]} />
        </div>
        <div>
          <div className="lbl">Checkbox &amp; radio</div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <Checkbox label="Include licensing support" defaultChecked />
            <Radio name="region" options={["GCC","United Kingdom","International"]} defaultValue="GCC" />
          </div>
        </div>
        <div>
          <div className="lbl">Switch</div>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <Switch label="Email me new matches" defaultChecked />
            <Switch label="SMS alerts" />
            <Input label="License number" error="This field is required." />
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
