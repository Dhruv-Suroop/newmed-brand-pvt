<!-- @dsCard group="Slides" viewport="1280x720" name="Closing statement" subtitle="Bedside register on ink" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .slide{position:relative;width:1280px;height:720px;background:var(--nm-ink);overflow:hidden;font-family:var(--font-sans);color:var(--nm-cream)}
  .content{position:relative;z-index:2;padding:96px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
  h2{font-family:var(--font-display);font-weight:500;font-size:64px;letter-spacing:-0.02em;line-height:1.06;margin:0;max-width:900px}
  .row{display:flex;gap:64px;margin-top:56px}
  .v{font-family:var(--font-display);font-weight:400;font-size:52px;letter-spacing:-0.02em;color:var(--nm-cream);line-height:1}
  .l{font-size:15px;color:rgba(248,243,234,0.65);margin-top:8px}
  .glow{position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(90% 70% at 108% -18%, rgba(255,81,34,0.5) 0%, rgba(255,81,34,0.22) 38%, rgba(255,81,34,0) 72%),
    radial-gradient(70% 90% at 118% 42%, rgba(255,157,0,0.28) 0%, rgba(255,157,0,0) 65%),
    radial-gradient(80% 60% at -12% 118%, rgba(124,49,52,0.5) 0%, rgba(124,49,52,0) 70%);
    filter:blur(30px)}
  .accent{color:var(--nm-cream);opacity:0.65}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel">
const { Logo, ArrowHighlight } = window.NewMedSkillsDesignSystem_cd1078;
function Slide(){
  return (
    <div className="slide">
      <div className="glow"></div>
      <div className="content">
        <Logo variant="horizontal" size={24} color="var(--nm-cream)" style={{marginBottom:"auto"}} />
        <h2>Your career shouldn't stop at a border. <ArrowHighlight fill="sunset"><span style={{fontWeight:500}}>We get you across it.</span></ArrowHighlight></h2>
        <div className="row">
          <div><div className="v">4–6 wks</div><div className="l">DataFlow verification</div></div>
          <div><div className="v">1:3</div><div className="l">Offer-to-hire ratio</div></div>
          <div><div className="v">96%</div><div className="l">Retention at 12 months</div></div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Slide/>);
</script>
</body>
</html>
