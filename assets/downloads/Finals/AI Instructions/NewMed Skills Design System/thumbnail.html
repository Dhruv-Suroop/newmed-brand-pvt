<!DOCTYPE html><html><head><meta charset="UTF-8" /><link rel="stylesheet" href="./styles.css" />
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden;font-family:var(--font-sans)}
  .main{flex:1;background:var(--nm-coral);display:flex;align-items:center;justify-content:center;padding:0 90px}
  .main img{width:78%;max-width:800px;filter:brightness(0) invert(1)}
  .strip{width:150px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style></head><body>
<div class="tile">
  <div class="main"><img src="./assets/logos/logo-horizontal-black.svg" alt="NewMed Skills" /></div>
  <div class="strip">
    <div style="background:#93cccd"></div>
    <div style="background:#ff9d00"></div>
    <div style="background:#7c3134"></div>
    <div style="background:#391e1a"></div>
  </div>
</div>
</body></html>
