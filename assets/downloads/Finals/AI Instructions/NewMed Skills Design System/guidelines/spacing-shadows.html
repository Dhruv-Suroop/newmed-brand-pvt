<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows" subtitle="Low, warm, diffuse — tinted ink not black" -->
<!DOCTYPE html><html><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
body{margin:0;background:var(--nm-cream);font-family:var(--font-sans);color:var(--text-primary);padding:28px;display:flex;gap:24px;align-items:center}
.b{display:flex;flex-direction:column;align-items:center;gap:12px}
.sq{width:80px;height:80px;background:var(--color-bg-raised);border-radius:var(--radius-md)}
.n{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}
</style></head><body>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-xs)"></div><span class="n">xs</span></div>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-sm)"></div><span class="n">sm</span></div>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-md)"></div><span class="n">md</span></div>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-lg)"></div><span class="n">lg</span></div>
<div class="b"><div class="sq" style="box-shadow:var(--shadow-coral);background:var(--brand-primary)"></div><span class="n">coral glow</span></div>
</body></html>
