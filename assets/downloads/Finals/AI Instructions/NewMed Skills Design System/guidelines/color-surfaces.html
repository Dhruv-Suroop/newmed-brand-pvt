<!-- @dsCard group="Colors" viewport="700x150" name="Accent & surfaces" subtitle="Teal counterpoint; cream page and surfaces" -->
<!DOCTYPE html><html><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
body{margin:0;background:var(--nm-cream);font-family:var(--font-sans);padding:20px;display:flex;gap:14px}
.sw{flex:1;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs);background:var(--color-bg-raised)}
.chip{height:64px;border-bottom:1px solid var(--border-subtle)}
.meta{padding:8px 10px}
.name{font-size:13px;font-weight:600;color:var(--text-primary)}
.hex{font-family:var(--font-mono);font-size:11.5px;color:var(--text-secondary);margin-top:2px}
</style></head><body>
<div class="sw"><div class="chip" style="background:#93cccd"></div><div class="meta"><div class="name">Teal — accent</div><div class="hex">#93CCCD</div></div></div>
<div class="sw"><div class="chip" style="background:#f8f3ea"></div><div class="meta"><div class="name">Cream — page</div><div class="hex">#F8F3EA</div></div></div>
<div class="sw"><div class="chip" style="background:#efe9e0"></div><div class="meta"><div class="name">Cream — sunken</div><div class="hex">#EFE9E0</div></div></div>
<div class="sw"><div class="chip" style="background:#ffffff"></div><div class="meta"><div class="name">White — raised</div><div class="hex">#FFFFFF</div></div></div>
</body></html>
