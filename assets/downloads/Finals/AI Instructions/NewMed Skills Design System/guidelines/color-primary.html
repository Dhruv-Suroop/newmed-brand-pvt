<!-- @dsCard group="Colors" viewport="700x150" name="Primary & warm" subtitle="Coral is the one true primary; orange & amber extend it" -->
<!DOCTYPE html><html><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
body{margin:0;background:var(--nm-cream);font-family:var(--font-sans);padding:20px;display:flex;gap:14px}
.sw{flex:1;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs);background:var(--color-bg-raised)}
.chip{height:64px}
.meta{padding:8px 10px}
.name{font-size:13px;font-weight:600;color:var(--text-primary)}
.hex{font-family:var(--font-mono);font-size:11.5px;color:var(--text-secondary);margin-top:2px}
</style></head><body>
<div class="sw"><div class="chip" style="background:#ff5122"></div><div class="meta"><div class="name">Coral — primary</div><div class="hex">#FF5122</div></div></div>
<div class="sw"><div class="chip" style="background:#ff7822"></div><div class="meta"><div class="name">Orange</div><div class="hex">#FF7822</div></div></div>
<div class="sw"><div class="chip" style="background:#ff9d00"></div><div class="meta"><div class="name">Amber</div><div class="hex">#FF9D00</div></div></div>
</body></html>
