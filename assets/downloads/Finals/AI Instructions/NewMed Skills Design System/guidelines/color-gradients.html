<!-- @dsCard group="Colors" viewport="700x160" name="Signature gradients" subtitle="Always organic & soft-flowing — never hard circle edges or sharp lines" -->
<!DOCTYPE html><html><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
body{margin:0;background:var(--nm-cream);font-family:var(--font-sans);padding:20px;display:flex;gap:14px}
.sw{flex:1;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-xs);background:var(--color-bg-raised)}
.chip{height:78px}
.meta{padding:8px 10px}
.name{font-size:13px;font-weight:600;color:var(--text-primary)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:2px}
</style></head><body>
<div class="sw"><div class="chip" style="background:var(--gradient-coral)"></div><div class="meta"><div class="name">Coral orb</div><div class="tok">--gradient-coral</div></div></div>
<div class="sw"><div class="chip" style="background:var(--gradient-amber)"></div><div class="meta"><div class="name">Amber orb</div><div class="tok">--gradient-amber</div></div></div>
<div class="sw"><div class="chip" style="background:var(--gradient-sunrise)"></div><div class="meta"><div class="name">Sunrise</div><div class="tok">--gradient-sunrise</div></div></div>
</body></html>
